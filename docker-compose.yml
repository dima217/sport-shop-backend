version: '3.8'

# Local development stack: app + Postgres + Redis
# Run: docker compose up --build

x-app-environment: &app-environment
  NODE_ENV: ${NODE_ENV:-development}
  PORT: ${PORT:-3000}
  DB_HOST: ${DB_HOST:-postgres}
  DB_PORT: ${DB_PORT:-5432}
  DB_USERNAME: ${DB_USERNAME:-myuser}
  DB_PASSWORD: ${DB_PASSWORD:-mysecretpassword}
  DB_DATABASE: ${DB_DATABASE:-mydatabase}
  DB_SYNCHRONIZE: ${DB_SYNCHRONIZE:-true}
  DB_SSL: ${DB_SSL:-false}
  REDIS_HOST: ${REDIS_HOST:-redis}
  REDIS_PORT: ${REDIS_PORT:-6379}
  REDIS_PASSWORD: ${REDIS_PASSWORD:-}
  JWT_SECRET: ${JWT_SECRET:-change_me_to_long_random_secret}
  ENABLE_SWAGGER: ${ENABLE_SWAGGER:-true}
  SWAGGER_TITLE: ${SWAGGER_TITLE:-Sport Equipment API}
  SWAGGER_DESCRIPTION: ${SWAGGER_DESCRIPTION:-REST API for Sport Equipment E-commerce}
  SWAGGER_VERSION: ${SWAGGER_VERSION:-1.0}
  SWAGGER_PATH: ${SWAGGER_PATH:-/api-docs}

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USERNAME:-myuser}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-mysecretpassword}
      POSTGRES_DB: ${DB_DATABASE:-mydatabase}
      # Railway volumes mount at root and contain lost+found — PGDATA must be a subdirectory
      PGDATA: /var/lib/postgresql/mount/data
    ports:
      - '${DB_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/mount
      - ./init-db:/docker-entrypoint-initdb.d
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${DB_USERNAME:-myuser} -d ${DB_DATABASE:-mydatabase} -h localhost',
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - '${REDIS_PORT:-6379}:6379'

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - '${APP_PORT:-3000}:${PORT:-3000}'
    environment:
      <<: *app-environment
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

volumes:
  postgres_data:
