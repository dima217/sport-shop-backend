version: '3.8'

# Railway stack template: app + Postgres + Redis (all as containers, no managed DB)
#
# Railway does NOT run compose files directly. Use this file to create services:
# 1. Dashboard -> New Project -> Empty project
# 2. Drag & drop this file OR create 3 services manually (see RAILWAY_DEPLOY.md)
# 3. Service names MUST be: postgres, redis, app
#
# Private networking hostnames:
#   postgres.railway.internal
#   redis.railway.internal

x-app-environment: &app-environment
  NODE_ENV: production  
  DB_HOST: postgres.railway.internal
  DB_PORT: 5432
  DB_USERNAME: ${DB_USERNAME:-myuser}
  DB_PASSWORD: ${DB_PASSWORD:-mysecretpassword}
  DB_DATABASE: ${DB_DATABASE:-mydatabase}
  DB_SYNCHRONIZE: ${DB_SYNCHRONIZE:-true}
  DB_SSL: 'false'
  REDIS_HOST: redis.railway.internal
  REDIS_PORT: 6379
  REDIS_PASSWORD: ${REDIS_PASSWORD:-}
  JWT_SECRET: ${JWT_SECRET:-change_me_to_long_random_secret}
  ENABLE_SWAGGER: ${ENABLE_SWAGGER:-true}
  SWAGGER_TITLE: Sport Equipment API
  SWAGGER_DESCRIPTION: REST API for Sport Equipment E-commerce
  SWAGGER_VERSION: '1.0'
  SWAGGER_PATH: /api-docs

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USERNAME:-myuser}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-mysecretpassword}
      POSTGRES_DB: ${DB_DATABASE:-mydatabase}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${DB_USERNAME:-myuser} -d ${DB_DATABASE:-mydatabase} -h localhost',
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      <<: *app-environment
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

volumes:
  postgres_data:
