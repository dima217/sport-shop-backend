version: '3.8'

# Railway: drag & drop → creates ONLY Postgres.
#
# After import:
# 1. DELETE old postgres service + old volume (if any failed init before)
# 2. Rename service to "postgres"
# 3. Attach NEW volume → mount path: /var/lib/postgresql/data
# 4. Variables (change password!):
#      POSTGRES_USER=myuser
#      POSTGRES_PASSWORD=<strong-password>
#      POSTGRES_DB=mydatabase
#      PGDATA=/var/lib/postgresql/data/pgdata
# 5. Redeploy → log: "database system is ready to accept connections"
#
# App: DB_HOST=postgres, same user/password/db

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-myuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mysecretpassword}
      POSTGRES_DB: ${POSTGRES_DB:-mydatabase}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
